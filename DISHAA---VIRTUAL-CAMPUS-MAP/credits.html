<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credits</title>
    <link rel="stylesheet" href="credits.css">
</head>
<body>
    <h1 class="heading">CREDITS</h1>
    <!-- Main content container -->
    <div class="content-container">
        <!-- Left images -->
        <div class="left-images">
            <img src="Picture1.jpg" alt="Member 1" class="member-image" data-overlay="har.jpg" data-name="Mr. Harshal Ninawe">
            <img src="Picture6.jpg" alt="Member 2" class="member-image" data-overlay="piy.jpg" data-name="Mr. Piyush Sahare">
            <img src="Picture3.jpg" alt="Member 3" class="member-image" data-overlay="jil.jpg" data-name="Mr. Jilani Sheikh">
        </div>

        <!-- Center image -->
        <div class="center-image">
            <img src="mentors01.jpg" alt="Centered Image">
        </div>

        <!-- Right images -->
        <div class="right-images">
            <img src="Picture5.jpg" alt="Member 4" class="member-image" data-overlay="man.jpg" data-name="Ms. Manasvi Tripathi">
            <img src="Picture4.jpg" alt="Member 5" class="member-image" data-overlay="loc.jpg" data-name="Ms. Lochan Gole">

        </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay">

            <img src="" alt="Member Info" id="overlay-image">
            <button class="close-button" id="close-button">×</button>
        </div>
    </div>

    <!-- Back button container -->
    <div class="back-button-container">
        <button class="back-button">Back</button>
    </div>
    <script src="credits.js"></script>
